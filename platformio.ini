; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src

[env:esp32dev]
platform = espressif32@7.1.3
board = featheresp32
framework = arduino
monitor_speed = 115200
build_flags = -D MQTT_MAX_PACKET_SIZE=2048  -I src/api/devices/sensors        



lib_deps =
    https://github.com/jkb-git/ESP32Servo.git#a337bc68fe6cc2188eae477c81de9b2b51e143ab
    https://github.com/knolleary/pubsubclient.git#4eb0dc703522f687bbe4629b8252b0d71e6771f2
    https://github.com/bblanchon/ArduinoJson.git#1cd478f48e7c4cd142a0bd26ee17d63d70d04e3f
    https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f
    smougenot/TM1637@0.0.0-alpha+sha.9486982048
    Adafruit GFX Library@1.12.6
    Adafruit SSD1306@2.5.17
    Adafruit BME280 Library@2.3.0
    Adafruit BMP280 Library@3.0.0
    bxparks/AceButton@1.10.1
    Adafruit Unified Sensor@1.1.15
    Adafruit BusIO@1.17.4
    ESP32Async/AsyncTCP@3.5.0


[env:OTA]
extends = env:esp32dev
upload_protocol = espota
; Pass --upload-port <device-ip> explicitly for each OTA upload.
upload_flags =
    --host_port=55910
    --timeout=20

[env:OTA_AP]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --host_port=55910
    --timeout=20

